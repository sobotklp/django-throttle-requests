name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10", "pypy-3.11"]
        experimental: [false]
        django: ["5.2.5", "6.0"]
        exclude:
          - python-version: "3.10"  # Django 6.0 support Python 3.12+
            django: "6.0"
          - python-version: "3.11"
            django: "6.0"
          - python-version: "pypy-3.10"
            django: "6.0"
          - python-version: "pypy-3.11"
            django: "6.0"
                    
    env:
      DJANGO: ${{ matrix.django }}
      
    continue-on-error: ${{ matrix.experimental }}

    # Use Redis service on localhost to run tests
    services:
      redis:
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.9.18"
        python-version: ${{ matrix.python-version }}

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install

    - name: Install Dependencies
      run: |
        uv sync --no-install-package=Django
        uv pip install --upgrade redis

    - name: Install Django ${{ matrix.django }}
      run: |
        uv pip install -q Django==$DJANGO

    - name: Run tests
      run: |
        uv run runtests.py --use-redis

    - name: Ruff linter and static code analysis
      run: |
        uvx ruff@latest check
