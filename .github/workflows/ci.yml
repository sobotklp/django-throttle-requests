name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy-3.10", "pypy-3.11", "pypy-3.12"]
        experimental: [false]
        django: ["5.2.5", "6.0", "6.1"]
        exclude:
          - python-version: "3.10"  # Django 6.0 support Python 3.12+
            django: "6.0"
          - python-version: "3.11"
            django: "6.0"
          - python-version: "pypy-3.10"
            django: "6.0"
          - python-version: "pypy-3.11"
            django: "6.0"
          - python-version: "3.10"  # Django 6.1 support Python 3.12+
            django: "6.1"
          - python-version: "3.11"
            django: "6.1"
          - python-version: "pypy-3.10"
            django: "6.1"
          - python-version: "pypy-3.11"
            django: "6.1"
                    
    env:
      DJANGO: ${{ matrix.django }}
      
    continue-on-error: ${{ matrix.experimental }}

    # Use Redis service on localhost to run tests
    services:
      redis:
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.0"
        python-version: ${{ matrix.python-version }}

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install

    - name: Install Dependencies
      run: |
        uv sync --no-install-package=Django
        uv pip install --upgrade redis

    - name: Install Django ${{ matrix.django }}
      run: |
        uv pip install -q Django==$DJANGO

    - name: Run tests
      run: |
        uv run runtests.py --use-redis

    - name: Ruff linter and static code analysis
      run: |
        uvx ruff@latest check
